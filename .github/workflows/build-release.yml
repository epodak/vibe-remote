name: Build and Release Windows Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: # 支持手动触发一键打包

permissions:
  contents: write

jobs:
  build-windows:
    name: Build vibe-remote (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller vibe-remote.spec

      - name: Compress Build Artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path dist/vibe-remote/* -DestinationPath dist/vibe-remote-windows-x64.zip
          Get-ChildItem -Path dist/

      - name: Upload Build Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: vibe-remote-windows-x64
          path: dist/vibe-remote-windows-x64.zip
          retention-days: 14

      - name: Create / Update Continuous Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "vibe-remote Latest Build (Continuous)"
          body: |
            ## 🚀 vibe-remote 自动持续集成构建产物 (Continuous Build)
            
            这是由 GitHub Actions 自动编译生成的最新 Windows 运行包。
            
            ### 📦 下载与运行
            1. 下载下方的 `vibe-remote-windows-x64.zip`。
            2. 解压到任意文件夹。
            3. 双击运行 `vibe-remote.exe` 即可启动。
            
            *构建时间: ${{ github.event.head_commit.timestamp }}*
            *关联提交: ${{ github.sha }}*
          draft: false
          prerelease: true
          files: dist/vibe-remote-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Formal Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vibe-remote-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
